name: YummyApp Mobile Backend CI Pipeline

on:
  push:
    branches: [main] # Goi y : main
  pull_request:
    branches: [main] # Goi y : main

jobs:
  mobile-test-job:
    runs-on: ubuntu-latest # Goi y : ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Execute Test Suite
        run: |
          coverage run -m unittest discover -s . -p "test_*.py" > logs/CHUNG/local_test.log 2>&1
          coverage report -m >> logs/CHUNG/local_test.log
